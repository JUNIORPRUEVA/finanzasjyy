# FINANZA — pila completa de producción (para EasyPanel o cualquier servidor)
#
# USO EN EASYPANEL
#   Proyecto → + Servicio → «Docker Compose» (Stack)
#     Repositorio : JUNIORPRUEVA/finanzasjyy
#     Rama        : master
#     Archivo     : docker-compose.produccion.yml
#   Las variables se rellenan en la pestaña «Environment» (ver deploy/easypanel/env.ejemplo).
#
# QUÉ LEVANTA
#   db  → PostgreSQL 16 con volumen propio. No publica puertos: sólo se llega
#         desde dentro de la pila.
#   api → API NestJS. Al arrancar aplica las migraciones (`prisma migrate deploy`).
#         NUNCA borra datos.
#   web → PWA servida por nginx, que además manda /api a la API. Es el ÚNICO
#         servicio que se publica (3000).
#
# La web y la API comparten dominio y puerto, así que no hay CORS ni problemas
# con las cookies de sesión.

name: finanzasjyy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FINANZA_DB_USER:?falta FINANZA_DB_USER}
      POSTGRES_PASSWORD: ${FINANZA_DB_PASSWORD:?falta FINANZA_DB_PASSWORD}
      POSTGRES_DB: ${FINANZA_DB_NAME:-finanza}
      TZ: America/Santo_Domingo
      PGTZ: America/Santo_Domingo
    volumes:
      - finanza_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${FINANZA_DB_USER} -d ${FINANZA_DB_NAME:-finanza}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3010
      HOST: 0.0.0.0
      TZ: America/Santo_Domingo
      DATABASE_URL: postgresql://${FINANZA_DB_USER}:${FINANZA_DB_PASSWORD}@db:5432/${FINANZA_DB_NAME:-finanza}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?falta JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?falta JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-2592000}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-720}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-168}
      OFFLINE_WINDOW_HOURS: ${OFFLINE_WINDOW_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    # EasyPanel publica este puerto y le asigna el dominio con HTTPS.
    ports:
      - '3000:80'

volumes:
  finanza_pgdata:
    name: finanzasjyy_pgdata
