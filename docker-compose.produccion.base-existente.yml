# FINANZA — pila de producción usando un PostgreSQL que YA existe en el panel
#
# ÚSELO SI: en su EasyPanel ya tiene un servicio de base de datos (por ejemplo el
# que llama «studio») y prefiere que FINANZA viva en una base dentro de él, en
# lugar de levantar otro PostgreSQL.
#
# ANTES DE DESPLEGAR (todo en el panel):
#   1. Abra su servicio PostgreSQL (p. ej. «studio»).
#   2. Databases → Create database → nombre: finanza
#   3. Users → cree «finanza_app» con una contraseña larga.
#   4. Copie el HOST INTERNO del servicio (p. ej. studio_finanzasjyy).
#   5. En «Environment» de este stack ponga:
#        DATABASE_URL=postgresql://finanza_app:LA_CLAVE@EL_HOST_INTERNO:5432/finanza?schema=public
#
#   El «?schema=public» del final NO es opcional: sin él, Prisma busca las tablas
#   en otro esquema y el arranque falla con «la tabla no existe».

name: finanzasjyy

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3010
      HOST: 0.0.0.0
      TZ: America/Santo_Domingo
      DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?falta JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?falta JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-2592000}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-720}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-168}
      OFFLINE_WINDOW_HOURS: ${OFFLINE_WINDOW_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '3000:80'
