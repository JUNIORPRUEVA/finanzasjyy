# nginx para la PWA de FINANZA.
#
# Este archivo es una PLANTILLA: al arrancar el contenedor, la imagen oficial de
# nginx sustituye ${API_UPSTREAM} por la dirección real de la API y deja el
# resultado en /etc/nginx/conf.d/default.conf. Así la misma imagen sirve para los
# dos modos de despliegue:
#
#   · Pila completa (docker compose): la API es el servicio «api» del mismo
#     archivo, así que el valor por defecto (http://api:3010) ya es correcto.
#   · Dos servicios separados (App de la API + App de la web): basta con poner
#     API_UPSTREAM=http://NOMBRE_INTERNO_DE_LA_API:3010 como variable del
#     servicio web. Sin tocar código ni volver a compilar.
#
# Si la API no responde, la web lo dirá con un 502; el registro del servicio web
# muestra el error exacto de nginx.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión: el paquete baja de ~985 kB a ~293 kB.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # El service worker NUNCA se cachea: si se cachea, las actualizaciones de la
    # app no llegan nunca al dispositivo.
    location = /sw.js {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Los recursos con hash en el nombre pueden cachearse indefinidamente.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # La API se sirve desde el mismo origen (evita CORS y problemas con las PWA).
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Tamaño máximo de subida (adjuntos de comprobantes).
        client_max_body_size 12m;
    }

    # Aplicación de una sola página: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
